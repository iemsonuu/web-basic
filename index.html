<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web &amp; Security Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== 1. DESIGN TOKENS (change these to re-theme every course) ===== */
:root{
  --bg:#090a0f;--surface:#12141c;--surface-subtle:#171a24;
  --console-bg:#0c0e14;--console-border:#222634;
  --text:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#1e2230;
  --accent:#38bdf8;--accent-soft:rgba(56,189,248,.1);--accent-border:rgba(56,189,248,.28);
  --success:#34d399;--success-soft:rgba(52,211,153,.12);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);
  --danger:#fb7185;--danger-soft:rgba(251,113,133,.14);
  --radius:14px;--shadow:0 12px 32px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.65}
code,.mono{font-family:'JetBrains Mono',monospace}
body{padding-bottom:72px}

/* ===== 2. COPY PROTECTION (deterrent) ===== */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
@media print{body>*:not(#wm-bar){display:none!important}body::before{content:"Printing is disabled.";display:block;padding:40px;color:#000}}

/* ===== 3. HEADER ===== */
.exec-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 28px}
.eh-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eh-brand{display:flex;align-items:center;gap:12px}
.eh-logo{width:34px;height:34px;border-radius:9px;background:var(--surface-subtle);border:1px solid var(--accent-border);display:grid;place-items:center;font:700 12px 'JetBrains Mono',monospace;color:var(--accent)}
.eh-title{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.eh-sub{font-size:12px;color:var(--text-muted);margin-left:8px;padding-left:8px;border-left:1px solid var(--border)}
@media(max-width:640px){.eh-sub{display:none}}
.eh-right{display:flex;align-items:center;gap:14px}
.progress-pill{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:99px;font:11.5px 'JetBrains Mono',monospace;color:var(--text-secondary)}
.pp-bar{width:88px;height:5px;border-radius:99px;background:var(--border);overflow:hidden}
.pp-fill{height:100%;width:10%;background:var(--accent);transition:width .3s ease}
.cheat-btn{font:500 12.5px 'Inter',sans-serif;padding:6px 13px;border-radius:8px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);transition:all .15s}
.cheat-btn:hover{border-color:var(--accent);color:var(--text)}

/* ===== 4. SHELL: sidebar + lesson stage ===== */
.app-shell{max-width:1200px;margin:28px auto 72px;padding:0 28px;display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:start}
@media(max-width:940px){.app-shell{grid-template-columns:1fr;gap:24px;padding:0 18px}}
.syllabus-nav{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 12px;box-shadow:var(--shadow);position:sticky;top:78px}
@media(max-width:940px){.syllabus-nav{position:static}}
.sn-header{padding:0 10px 12px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sn-course{font:600 10.5px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent)}
.sn-count{font:10.5px 'JetBrains Mono',monospace;color:var(--text-muted)}
.sn-group{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);padding:12px 10px 5px}
.sn-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:8.5px 10px;border-radius:8px;border:1px solid transparent;background:transparent;font:13px 'Inter',sans-serif;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.sn-item-left{display:flex;align-items:center;gap:9px;min-width:0}
.sn-item:hover{background:var(--surface-subtle);color:var(--text)}
.sn-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border);font-weight:600}
.sn-num{font:11px 'JetBrains Mono',monospace;opacity:.75;flex:0 0 20px}
.sn-check{font:11px 'JetBrains Mono',monospace;color:var(--accent);opacity:0}
.sn-item.visited .sn-check{opacity:1}

.lesson-stage{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:44px 50px;box-shadow:var(--shadow);min-width:0}
@media(max-width:680px){.lesson-stage{padding:26px 20px}}
.lh-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lh-step{font:600 11.5px 'JetBrains Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.lh-progress{font:11.5px 'JetBrains Mono',monospace;color:var(--text-muted)}
.lh-title{font-size:32px;font-weight:700;line-height:1.22;letter-spacing:-.5px;margin-bottom:14px}
.lh-lead{font-size:16.5px;line-height:1.78;color:var(--text-secondary);padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:34px}
.lh-lead strong{color:var(--text);font-weight:600}
.block-section{margin-bottom:36px}
.block-label{font:600 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-bottom:14px;display:flex;justify-content:space-between}

/* ===== 5. CONCEPT CARDS ===== */
.concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.concept-grid{grid-template-columns:1fr}}
.concept-card{background:var(--surface-subtle);border:1px solid var(--border);border-radius:11px;padding:20px;display:flex;flex-direction:column;gap:6px}
.cc-tag{font:600 11px 'JetBrains Mono',monospace;color:var(--accent)}
.cc-title{font-size:15px;font-weight:600}
.cc-body{font-size:13.5px;line-height:1.65;color:var(--text-secondary)}
.cc-code,.cc-body code{font:12px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:5px;background:var(--console-bg);border:1px solid var(--console-border);color:#e2e8f0}

/* ===== 6. INTERACTIVE CONSOLE ===== */
.console-box{background:var(--console-bg);border:1px solid var(--console-border);border-radius:12px;overflow:hidden;color:#f8fafc}
.cb-top{padding:13px 20px;border-bottom:1px solid var(--console-border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.015)}
.cb-title{font:12px 'JetBrains Mono',monospace;color:#94a3b8;display:flex;align-items:center;gap:8px}
.cb-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.cb-presets{display:flex;gap:7px;flex-wrap:wrap}
.cb-btn{font:500 11.5px 'JetBrains Mono',monospace;padding:6.5px 12px;border-radius:7px;border:1px solid var(--console-border);background:var(--surface-subtle);color:#cbd5e1;cursor:pointer;transition:all .15s}
.cb-btn:hover{border-color:#475569;color:#fff}
.cb-btn.active{background:var(--accent);color:#090a0f;border-color:var(--accent);font-weight:600}
.cb-query-bar{padding:16px 20px;border-bottom:1px solid var(--console-border);font:13.5px 'JetBrains Mono',monospace;color:#e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(0,0,0,.25);line-height:1.6}
.sql-kw{color:var(--accent);font-weight:600}.sql-str{color:color-mix(in srgb,var(--accent) 55%,#fff)}.sql-num{color:var(--warn)}
.sql-inj{color:var(--danger);background:var(--danger-soft);padding:2px 6px;border-radius:4px;font-weight:600}
.sql-comment{color:#64748b;text-decoration:line-through;font-style:italic}
.cb-status{font:11.5px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cb-status.warn{background:var(--warn-soft);color:var(--warn)}
.cb-status.danger{background:var(--danger-soft);color:var(--danger)}
.cb-table-wrap{padding:16px 20px;overflow-x:auto}
.cb-table{width:100%;border-collapse:collapse;font:12.5px 'JetBrains Mono',monospace}
.cb-table th{text-align:left;padding:9px 12px;color:#94a3b8;border-bottom:1px solid var(--console-border);font-weight:500}
.cb-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:#cbd5e1}
.cb-table tr:last-child td{border-bottom:none}
.cb-table tr.matched td{background:var(--accent-soft);color:#fff}
.cb-table tr.filtered td{opacity:.5}
.cb-explain{padding:15px 20px;background:var(--accent-soft);border-top:1px solid var(--console-border);font-size:13.5px;color:#e2e8f0;line-height:1.65}
.cb-explain strong{color:#fff}.cb-explain code{font:12.5px 'JetBrains Mono',monospace;color:var(--accent)}

/* ===== 7. NOTES + CHECK QUESTION ===== */
.notes-card{background:var(--surface-subtle);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;padding:22px 26px}
.nc-head{font:600 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:12px;display:flex;justify-content:space-between}
.nc-list{padding-left:18px;font-size:14.5px;line-height:1.78;color:var(--text-secondary)}
.nc-list li{margin-bottom:7px}.nc-list li:last-child{margin-bottom:0}
.nc-list strong{color:var(--text);font-weight:600}
.nc-list code{font:12.5px 'JetBrains Mono',monospace;padding:1.5px 5px;border-radius:4px;background:var(--console-bg);border:1px solid var(--border);color:#e2e8f0}
.classroom-prompt{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cp-question{font-size:13.5px;font-weight:500;flex:1;min-width:220px}
.cp-question span{font:11px 'JetBrains Mono',monospace;color:var(--warn);text-transform:uppercase;margin-right:8px}
.cp-btn{font:11.5px 'JetBrains Mono',monospace;padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer}
.cp-btn:hover{border-color:var(--accent);color:var(--text)}
.cp-answer{width:100%;display:none;margin-top:8px;padding:11px 14px;border-radius:8px;background:var(--console-bg);border:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
.cp-answer.show{display:block}.cp-answer strong{color:var(--accent)}

/* ===== 8. FOOTER NAV + MODAL ===== */
.stage-footer{margin-top:38px;padding-top:24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sf-btn{font:600 13.5px 'Inter',sans-serif;padding:10px 20px;border-radius:9px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface-subtle);color:var(--text)}
.sf-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.sf-btn:disabled{opacity:.35;cursor:not-allowed}
.sf-btn.primary{background:var(--accent);color:#090a0f;border-color:var(--accent)}
.sf-btn.primary:hover:not(:disabled){opacity:.9;color:#090a0f}
.sf-hint{font:11.5px 'JetBrains Mono',monospace;color:var(--text-muted)}
@media(max-width:640px){.sf-hint{display:none}}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:880px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mc-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mc-title{font-size:16px;font-weight:600}
.mc-close{background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px}
.mc-body{padding:20px 24px;overflow-y:auto}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:18px 20px}
.fc{background:var(--surface-subtle);border:1px solid var(--console-border);border-radius:9px;padding:13px;display:flex;flex-direction:column;gap:6px}
.fc-s{font:10.5px 'JetBrains Mono',monospace;color:var(--accent);text-transform:uppercase}
.fc-c{font:12px 'JetBrains Mono',monospace;color:var(--accent);background:var(--bg);padding:7px 9px;border-radius:6px;border:1px solid var(--border);word-break:break-word}
.fc-d{font-size:12px;color:var(--text-secondary);line-height:1.5}
/* visual engine */
.vis-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.vis-card{background:var(--console-bg);border:1px solid var(--console-border);border-radius:12px;overflow:hidden}
.diag{display:block;width:100%;height:auto}
.dn{fill:var(--surface-subtle);stroke:var(--console-border);stroke-width:1.5;transition:all .25s}
.dn.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.dn.bad{fill:var(--danger-soft);stroke:var(--danger);stroke-width:2.5}
.de{stroke:#475569;stroke-width:2;fill:none}
.de.on{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.mk{fill:#475569}.mkOn{fill:var(--accent)}
.di{font-size:26px;text-anchor:middle}
.dt{fill:var(--text);font:600 13px Inter,sans-serif;text-anchor:middle}
.ds{fill:var(--text-muted);font:10.5px 'JetBrains Mono',monospace;text-anchor:middle}
.dl{fill:var(--text-secondary);font:11px 'JetBrains Mono',monospace;text-anchor:middle;paint-order:stroke;stroke:var(--console-bg);stroke-width:4px}
.dl.on{fill:var(--accent);font-weight:600}
.pk{fill:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.vis-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--console-border)}
.vis-n{margin-left:auto;font:11.5px 'JetBrains Mono',monospace;color:var(--text-muted)}
.vis-cap{padding:14px 20px;background:var(--accent-soft);border-top:1px solid var(--console-border);font-size:13.5px;color:#e2e8f0;line-height:1.65;min-height:58px}
.vis-cap b{color:#fff}.vis-cap code{font:12.5px 'JetBrains Mono',monospace;color:var(--accent)}
.anat{display:flex;flex-direction:column;gap:12px;padding:18px 20px;background:var(--console-bg);border:1px solid var(--console-border);border-radius:12px}
.ap{display:grid;grid-template-columns:minmax(0,1fr) 22px 250px;gap:10px;align-items:center}
@media(max-width:760px){.ap{grid-template-columns:1fr}.aar{display:none}}
.ac{font:12.5px/1.6 'JetBrains Mono',monospace;color:#f1f5f9;border:1px solid;border-radius:9px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;margin:0}
.al{border:1px solid;border-radius:9px;padding:9px 12px;display:flex;flex-direction:column;font-size:12.5px;color:var(--text-secondary);background:var(--surface-subtle)}
/* network map */
.lk{stroke:#334155;stroke-width:2.5}.lk.on{stroke:var(--accent);stroke-width:3.5;fill:none;opacity:.9}
.dv *{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dv.bad *{stroke:var(--danger);fill:var(--danger-soft)}
.dv{opacity:.5;transition:opacity .3s}.dv.on{opacity:1}
.dv.on *{filter:drop-shadow(0 0 5px var(--accent))}.dv.bad.on *{filter:drop-shadow(0 0 5px var(--danger))}
.pl{fill:#fff;font:600 11px 'JetBrains Mono',monospace;text-anchor:middle;paint-order:stroke;stroke:var(--console-bg);stroke-width:4px}
.vis-tg{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--console-border)}
.vis-pan{padding:14px 18px;border-top:1px solid var(--console-border);overflow-x:auto}
.insp{display:grid;grid-template-columns:110px 1fr;gap:7px 14px;font-size:13px;color:#e2e8f0}
.insp b{color:var(--text-muted);font:11px 'JetBrains Mono',monospace;text-transform:uppercase;padding-top:2px}
.cb-table tr.cur td{background:var(--accent-soft);color:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font:600 11px 'JetBrains Mono',monospace}
/* ===== 9. THEME DOTS (optional picker) ===== */
.theme-dots{display:flex;gap:6px}
.theme-dot{width:14px;height:14px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.theme-dot.on{border-color:#fff}
</style>
</head>
<body>

<header class="exec-header">
  <div class="eh-inner">
    <div class="eh-brand">
      <div class="eh-logo">&gt;_</div>
      <span class="eh-title" id="brandTitle"></span>
      <span class="eh-sub" id="brandSub"></span>
    </div>
    <div class="eh-right">
      <div class="theme-dots" id="themeDots"></div>
      <div class="progress-pill"><span id="topProgressText"></span><div class="pp-bar"><div class="pp-fill" id="topProgressFill"></div></div></div>
      <button class="cheat-btn" onclick="toggleModal(true)">Quick reference</button>
    </div>
  </div>
</header>

<div class="app-shell">
  <aside class="syllabus-nav" aria-label="Course syllabus">
    <div class="sn-header"><span class="sn-course">Syllabus</span><span class="sn-count" id="countLabel"></span></div>
    <div id="syllabus"></div>
  </aside>

  <main class="lesson-stage">
    <div class="lh-meta"><span class="lh-step" id="moduleTag"></span><span class="lh-progress" id="stepCount"></span></div>
    <h1 class="lh-title" id="lessonTitle"></h1>
    <p class="lh-lead" id="lessonLead"></p>

    <div class="block-section">
      <div class="block-label"><span>01 · Core mechanics</span><span>3 key concepts</span></div>
      <div class="concept-grid" id="cards"></div>
    </div>

    <div class="block-section" id="visBlock">
      <div class="block-label"><span>02 · Visual explainer</span><span id="visSub"></span></div>
      <div id="visual"></div>
    </div>

    <div class="block-section">
      <div class="block-label"><span>03 · Interactive console</span><span>Click a preset to test it</span></div>
      <div class="console-box">
        <div class="cb-top"><div class="cb-title"><span class="cb-dot"></span><span id="consoleTitle"></span></div><div class="cb-presets" id="presets"></div></div>
        <div class="cb-query-bar"><div id="queryText"></div><span class="cb-status" id="statusBadge"></span></div>
        <div class="cb-table-wrap" id="tableWrap"></div>
        <div class="cb-explain" id="explain"></div>
      </div>
    </div>

    <div class="block-section" style="margin-bottom:0">
      <div class="block-label"><span>04 · Reference notes &amp; check</span><span>Revision summary</span></div>
      <div class="notes-card">
        <div class="nc-head"><span>Key takeaways</span><span id="noteBadge"></span></div>
        <ul class="nc-list" id="notes"></ul>
        <div class="classroom-prompt">
          <div class="cp-question"><span>Check:</span><strong id="promptQ"></strong></div>
          <button class="cp-btn" id="promptBtn" onclick="toggleAnswer()">Reveal answer</button>
          <div class="cp-answer" id="promptA"></div>
        </div>
      </div>
    </div>

    <footer class="stage-footer">
      <button class="sf-btn" id="prevBtn" onclick="stepLesson(-1)">← Previous lesson</button>
      <span class="sf-hint">Use ← and → to switch lessons</span>
      <button class="sf-btn primary" id="nextBtn" onclick="stepLesson(1)">Next lesson →</button>
    </footer>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-card">
    <div class="mc-head"><span class="mc-title" id="modalTitle"></span><button class="mc-close" onclick="toggleModal(false)">✕ Close</button></div>
    <div class="mc-body"><table class="cb-table"><thead><tr id="refHead"></tr></thead><tbody id="refBody"></tbody></table></div>
  </div>
</div>

<script>
/* =====================================================================
   COURSE CONFIG: edit this block only to make a new course
   ===================================================================== */
const K=s=>'<span class="sql-kw">'+s+'</span>',S=s=>'<span class="sql-str">'+s+'</span>',I=s=>'<span class="sql-inj">'+s+'</span>';
const C=(tag,title,body)=>({tag,title,body});
const P=(label,query,status,cols,rows,highlight,explain,statusType)=>({label,query,status,statusType:statusType||'',cols,rows,highlight,explain});
const F=(label,query,status,flow,explain,statusType)=>({label,query,status,statusType:statusType||'',flow,explain});
const COURSE = {
  brand: 'Web & Security Foundations',
  subtitle: 'From the web to OWASP Top 10:2025',
  watermark: 'sonu.ohac',
  theme: 'violet',
  showThemePicker: false,
  modalTitle: 'Quick reference: web, HTTP & OWASP 2025',
  refColumns: ['Term', 'Category', 'What it means'],
  reference: [
    ['<code>DNS</code>','Network','Turns a domain name into an IP address'],
    ['<code>Port 443 / 80</code>','Network','The “door” for HTTPS / HTTP on a server'],

const LESSONS = COURSE.lessons;
let cur = 0;
const visited = new Set([0]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = n => String(n + 1).padStart(2, '0');

function renderSyllabus() {
  let html = '', last = '';
  LESSONS.forEach((l, i) => {
    if (l.group !== last) { html += '<div class="sn-group">' + esc(l.group) + '</div>'; last = l.group; }
    html += '<button class="sn-item ' + (i === cur ? 'active ' : '') + (visited.has(i) ? 'visited' : '') + '" onclick="loadLesson(' + i + ')">' +
      '<span class="sn-item-left"><span class="sn-num">' + pad(i) + '</span><span>' + esc(l.shortTitle) + '</span></span><span class="sn-check">✓</span></button>';
  });
  $('syllabus').innerHTML = html;
  $('countLabel').textContent = visited.size + ' / ' + LESSONS.length + ' viewed';
}

function loadLesson(i) {
  cur = Math.max(0, Math.min(i, LESSONS.length - 1));
  visited.add(cur);
  const l = LESSONS[cur], n = LESSONS.length;
  $('topProgressText').textContent = 'Lesson ' + pad(cur) + ' / ' + String(n).padStart(2, '0');
  $('topProgressFill').style.width = ((cur + 1) / n * 100) + '%';
  $('moduleTag').textContent = l.moduleTag;
  $('stepCount').textContent = 'Lesson ' + pad(cur) + ' of ' + n;
  $('lessonTitle').textContent = l.title;
  $('lessonLead').innerHTML = l.lead;
  $('cards').innerHTML = l.cards.map(c =>
    '<div class="concept-card"><span class="cc-tag">' + esc(c.tag) + '</span><div class="cc-title">' + esc(c.title) + '</div><p class="cc-body">' + c.body + '</p></div>').join('');
  renderVisuals(l);
  $('consoleTitle').textContent = l.consoleTitle;
  $('presets').innerHTML = l.presets.map((p, k) => '<button class="cb-btn" onclick="runPreset(' + k + ')">' + esc(p.label) + '</button>').join('');
  runPreset(0);
  $('noteBadge').textContent = 'Lesson ' + pad(cur);
  $('notes').innerHTML = l.notes.map(x => '<li>' + x + '</li>').join('');
  $('promptQ').textContent = l.promptQ;
  $('promptA').innerHTML = l.promptA;
  $('promptA').classList.remove('show');
  $('promptBtn').textContent = 'Reveal answer';
  $('prevBtn').disabled = cur === 0;
  $('nextBtn').disabled = cur === n - 1;
  renderSyllabus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function runPreset(k) {
  const p = LESSONS[cur].presets[k];
  document.querySelectorAll('#presets .cb-btn').forEach((b, i) => b.classList.toggle('active', i === k));
  $('queryText').innerHTML = p.query;
  $('statusBadge').textContent = p.status;
  $('statusBadge').className = 'cb-status' + (p.statusType ? ' ' + p.statusType : '');
  if (p.flow) {
    $('tableWrap').innerHTML = '<div class="flow">' + p.flow.map(f => '<div class="fc"><span class="fc-s">' + esc(f[0]) + '</span><div class="fc-c">' + esc(f[1]) + '</div><div class="fc-d">' + esc(f[2]) + '</div></div>').join('') + '</div>';
  } else if (p.error) {
    $('tableWrap').innerHTML = '<div style="padding:14px;color:var(--danger);font:13px \'JetBrains Mono\',monospace">' + esc(p.error) + '</div>';
  } else {
    const hl = p.highlight || [];
    $('tableWrap').innerHTML = '<table class="cb-table"><thead><tr>' + p.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
      p.rows.map((r, i) => '<tr class="' + (hl.includes(i) ? 'matched' : 'filtered') + '">' + r.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }
  $('explain').innerHTML = p.explain;
}

function drawDiagram(d,si){
  const s=d.steps[si],hE=s.e||[],hN=s.n||[],bad=s.bad||[];
  let h='<svg class="diag" viewBox="0 0 800 '+(d.h||290)+'" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mk"/></marker><marker id="ahOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mkOn"/></marker></defs>';
  d.edges.forEach((e,i)=>{const g=geom(d,e),on=hE.includes(i);
    h+='<line class="de'+(on?' on':'')+'" x1="'+g.x1+'" y1="'+g.y1+'" x2="'+g.x2+'" y2="'+g.y2+'" marker-end="url(#'+(on?'ahOn':'ah')+')"/>';
    if(e.l)h+='<text class="dl'+(on?' on':'')+'" x="'+(g.x1+g.x2)/2+'" y="'+((g.y1+g.y2)/2-6)+'">'+esc(e.l)+'</text>';});
  d.nodes.forEach(n=>{const b=bx(n),cx=n.x+b.w/2,cy=n.y+b.h/2,c=bad.includes(n.id)?' bad':hN.includes(n.id)?' on':'';
    h+='<rect class="dn'+c+'" x="'+n.x+'" y="'+n.y+'" width="'+b.w+'" height="'+b.h+'" rx="12"/>';
    if(b.h<60)h+='<text class="dt" x="'+cx+'" y="'+(cy+5)+'">'+n.i+' '+esc(n.t)+'</text>';
    else h+='<text class="di" x="'+cx+'" y="'+(cy-6)+'">'+n.i+'</text><text class="dt" x="'+cx+'" y="'+(cy+15)+'">'+esc(n.t)+'</text>'+(n.s?'<text class="ds" x="'+cx+'" y="'+(cy+31)+'">'+esc(n.s)+'</text>':'');});
  hE.forEach(i=>{const g=geom(d,d.edges[i]);h+='<circle r="6" class="pk"><animateMotion dur="1.3s" repeatCount="indefinite" path="M'+g.x1+' '+g.y1+' L'+g.x2+' '+g.y2+'"/></circle>';});
  return h+'</svg>';
}
function renderVisuals(l){
  clearInterval(VS.tm);VS.tm=null;VS.ti=0;VS.st=0;VS.pn={};
  const blk=$('visBlock');
  if(!l.visuals){blk.style.display='none';return;}
  blk.style.display='';$('visSub').textContent='Step through it or press Play';renderVisual(true);
}
const PC={DNS:'#fbbf24',REDIR:'#fbbf24',TCP:'#38bdf8',TLS:'#a78bfa',HTTP:'#34d399',APP:'#38bdf8',RISK:'#fb7185',ERR:'#fb7185',BLOCK:'#fb7185'};
const pcol=p=>PC[p[3]]||'var(--accent)',SP=[0.5,1,2];
const IC={laptop:'<rect x="-22" y="-16" width="44" height="28" rx="3"/><path d="M-28 16h56l-5-4h-46z"/>',router:'<rect x="-24" y="-2" width="48" height="16" rx="4"/><path d="M-14 -2v-13M14 -2v-13"/><circle cx="-12" cy="6" r="1.8"/><circle cx="-4" cy="6" r="1.8"/>',cloud:'<path d="M-22 12a10 10 0 0 1 2-19a14 14 0 0 1 27-3a11 11 0 0 1 5 22z"/>',server:'<rect x="-20" y="-20" width="40" height="12" rx="3"/><rect x="-20" y="-6" width="40" height="12" rx="3"/><rect x="-20" y="8" width="40" height="12" rx="3"/><circle cx="-13" cy="-14" r="1.6"/><circle cx="-13" cy="0" r="1.6"/><circle cx="-13" cy="14" r="1.6"/>',db:'<ellipse cx="0" cy="-14" rx="18" ry="6"/><path d="M-18 -14v26a18 6 0 0 0 36 0v-26M-18 -2a18 6 0 0 0 36 0M-18 8a18 6 0 0 0 36 0"/>',user:'<circle cx="0" cy="-10" r="9"/><path d="M-16 18c0-14 8-20 16-20s16 6 16 20z"/>',attacker:'<circle cx="0" cy="-10" r="9"/><path d="M-16 18c0-14 8-20 16-20s16 6 16 20zM-6 -12h12"/>',box:'<path d="M-18 -8l18-10l18 10v18l-18 10l-18-10zM-18 -8l18 10l18-10M0 2v18"/>',doc:'<rect x="-14" y="-20" width="28" height="40" rx="3"/><path d="M-8 -8h16M-8 0h16M-8 8h10"/>'};
const cnt=v=>v.type==='net'?v.packets.length:v.steps.length,dev=(v,id)=>v.devices.find(x=>x.id===id);
function route(v,s,d){const adj={};v.links.forEach(([a,b])=>{(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);});const q=[[s]],seen={[s]:1};while(q.length){const p=q.shift(),l=p[p.length-1];if(l===d)return p;(adj[l]||[]).forEach(n=>{if(!seen[n]){seen[n]=1;q.push(p.concat(n));}});}return [s,d];}
function drawNet(v,si){
  const p=v.packets[si],path=route(v,p[0],p[1]),pts=path.map(id=>{const d=dev(v,id);return d.x+' '+d.y;}),blocked=p[3]==='BLOCK';
  let h='<svg class="diag" viewBox="0 0 800 300" role="img">';
  v.links.forEach(([a,b])=>{const A=dev(v,a),B=dev(v,b);h+='<line class="lk" x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'"/>';});
  h+='<polyline class="lk on" points="'+pts.join(' ')+'"/>';
  v.devices.forEach(d=>{const on=path.includes(d.id),bad=d.k==='attacker'||(blocked&&d.id===p[1]);
    h+='<g class="dv'+(bad?' bad':'')+(on?' on':'')+'" transform="translate('+d.x+','+d.y+')">'+IC[d.k]+'</g><text class="dt" x="'+d.x+'" y="'+(d.y+40)+'">'+esc(d.t)+'</text>'+(d.s?'<text class="ds" x="'+d.x+'" y="'+(d.y+54)+'">'+esc(d.s)+'</text>':'');});
  const dur=(Math.min(0.8*(pts.length-1),2.6)/SP[VS.sp]).toFixed(2);
  h+='<g><animateMotion dur="'+dur+'s" path="M'+pts.join(' L')+'" fill="freeze"/><circle r="8" style="fill:'+pcol(p)+'"/><text class="pl" y="-15">'+esc(p[2])+'</text></g></svg>';
  return h;
}
function seqSvg(v,si,an){
  const ids=[];v.packets.forEach(p=>[p[0],p[1]].forEach(x=>{if(!ids.includes(x))ids.push(x);}));
  const k=ids.length,X=i=>k>1?90+i*(620/(k-1)):400,H=70+v.packets.length*30;
  let h='<svg class="diag" viewBox="0 0 800 '+H+'"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mk"/></marker></defs>';
  ids.forEach((id,i)=>{h+='<text class="dt" x="'+X(i)+'" y="22">'+esc(dev(v,id).t)+'</text><line x1="'+X(i)+'" y1="34" x2="'+X(i)+'" y2="'+(H-10)+'" style="stroke:#334155;stroke-dasharray:4 4;stroke-width:2"/>';});
  v.packets.forEach((p,j)=>{const a=X(ids.indexOf(p[0])),b=X(ids.indexOf(p[1])),y=62+j*30;
    h+='<g style="opacity:'+(j<=si?1:.25)+'"><line x1="'+a+'" y1="'+y+'" x2="'+b+'" y2="'+y+'" style="stroke:'+pcol(p)+';stroke-width:'+(j===si?3:2)+'" marker-end="url(#ah)"/><text class="dl'+(j===si?' on':'')+'" x="'+(a+b)/2+'" y="'+(y-6)+'">'+esc(p[2])+'</text></g>';});
  if(an){const p=v.packets[si],a=X(ids.indexOf(p[0])),b=X(ids.indexOf(p[1])),y=62+si*30;h+='<circle r="7" style="fill:'+pcol(p)+'"><animateMotion dur="1.2s" path="M'+a+' '+y+' L'+b+' '+y+'" fill="freeze"/></circle>';}
  return h+'</svg>';
}
function netPanels(v,si){
  let h='';const p=v.packets[si];
  if(VS.pn.list)h+='<div class="vis-pan"><table class="cb-table"><thead><tr><th>#</th><th>From → To</th><th>Protocol</th><th>Info</th></tr></thead><tbody>'+v.packets.map((q,j)=>'<tr class="'+(j===si?'cur':'')+'" style="cursor:pointer;'+(j>si?'opacity:.45':'')+'" onclick="visJump('+j+')"><td>'+(j+1)+'</td><td>'+esc(dev(v,q[0]).t)+' → '+esc(dev(v,q[1]).t)+'</td><td><span class="chip" style="background:color-mix(in srgb,'+pcol(q)+' 18%,transparent);color:'+pcol(q)+'">'+esc(q[3])+'</span></td><td>'+esc(q[2])+'</td></tr>').join('')+'</tbody></table></div>';
  if(VS.pn.seq&&v.view!=='seq')h+='<div class="vis-pan">'+seqSvg(v,si)+'</div>';
  if(VS.pn.insp)h+='<div class="vis-pan"><div class="insp"><b>Packet</b><span>'+(si+1)+' of '+v.packets.length+'</span><b>Label</b><span>'+esc(p[2])+'</span><b>From</b><span>'+esc(dev(v,p[0]).t)+'</span><b>To</b><span>'+esc(dev(v,p[1]).t)+'</span><b>Path</b><span>'+route(v,p[0],p[1]).map(i=>esc(dev(v,i).t)).join(' → ')+'</span><b>Protocol</b><span>'+esc(p[3])+'</span><b>Meaning</b><span>'+esc(p[4])+'</span></div></div>';
  return h;
}
function renderVisual(keep){
  if(!keep){clearInterval(VS.tm);VS.tm=null;}
  const vs=LESSONS[cur].visuals,v=vs[VS.ti],n=v.type==='anatomy'?0:cnt(v);
  let h=vs.length>1?'<div class="vis-tabs">'+vs.map((x,i)=>'<button class="cb-btn'+(i===VS.ti?' active':'')+'" onclick="visTab('+i+')">'+esc(x.tab)+'</button>').join('')+'</div>':'';
  const ctl='<div class="vis-ctrl"><button class="cb-btn" onclick="visStep(-1)">◀ Prev</button><button class="cb-btn" onclick="visPlay()">'+(VS.tm?'❚❚ Pause':'▶ Play')+'</button><button class="cb-btn" onclick="visStep(1)">Next ▶</button><button class="cb-btn" onclick="visJump(0)">↺ Restart</button>'+(v.type==='net'?'<button class="cb-btn" onclick="visSpeed()">Speed '+SP[VS.sp]+'×</button>':'')+'<span class="vis-n">Step '+(VS.st+1)+' / '+n+'</span></div>';
  if(v.type==='anatomy'){
    h+='<div class="anat">'+v.parts.map(p=>{const c=AC[p.c];return '<div class="ap"><pre class="ac" style="border-color:'+c+';background:color-mix(in srgb,'+c+' 13%,transparent)">'+esc(p.code)+'</pre><span class="aar" style="color:'+c+'">➜</span><div class="al" style="border-color:'+c+'"><b style="color:'+c+'">'+esc(p.l)+'</b><span>'+esc(p.n)+'</span></div></div>';}).join('')+'</div>';
  }else if(v.type==='net'){
    const p=v.packets[VS.st];
    const fx=v.fix!==undefined,bad=fx&&VS.st<v.fix;
    h+='<div class="vis-card">'+(v.view==='seq'?seqSvg(v,VS.st,1):drawNet(v,VS.st))+ctl+'<div class="vis-cap"'+(bad?' style="background:var(--danger-soft)"':'')+'>'+(fx?'<span class="chip" style="margin-right:8px;background:'+(bad?'var(--danger-soft);color:var(--danger)':'var(--accent-soft);color:var(--accent)')+'">'+(bad?'⚠ Without the fix':'✔ With the fix')+'</span>':'')+'<b>'+esc(p[2])+'</b> · '+esc(p[4])+'</div><div class="vis-tg"><button class="cb-btn'+(VS.pn.list?' active':'')+'" onclick="visPanel(\'list\')">Packet list</button>'+(v.view==='seq'?'':'<button class="cb-btn'+(VS.pn.seq?' active':'')+'" onclick="visPanel(\'seq\')">Sequence</button>')+'<button class="cb-btn'+(VS.pn.insp?' active':'')+'" onclick="visPanel(\'insp\')">Inspector</button></div>'+netPanels(v,VS.st)+'</div>';
  }else{
    h+='<div class="vis-card">'+drawDiagram(v,VS.st)+ctl+'<div class="vis-cap">'+v.steps[VS.st].t+'</div></div>';
  }
  $('visual').innerHTML=h;
}
function visTab(i){VS.ti=i;VS.st=0;renderVisual();}
function visStep(d){const n=cnt(LESSONS[cur].visuals[VS.ti]);VS.st=(VS.st+d+n)%n;renderVisual();}
function visJump(i){VS.st=i;renderVisual();}
function visSpeed(){VS.sp=(VS.sp+1)%3;renderVisual(true);if(VS.tm){visPlay();visPlay();}}
function visPanel(k){VS.pn[k]=!VS.pn[k];renderVisual(true);}
function visPlay(){
  if(VS.tm){clearInterval(VS.tm);VS.tm=null;renderVisual(true);return;}
  VS.tm=setInterval(()=>{const n=cnt(LESSONS[cur].visuals[VS.ti]);VS.st=(VS.st+1)%n;renderVisual(true);},3200/SP[VS.sp]);renderVisual(true);
}
const stepLesson = d => loadLesson(cur + d);
function toggleAnswer() {
  const a = $('promptA'); a.classList.toggle('show');
  $('promptBtn').textContent = a.classList.contains('show') ? 'Hide answer' : 'Reveal answer';
}
function toggleModal(show) { $('modal').classList.toggle('open', show); }

/* ===================== THEMES ===================== */
const THEMES = {
  ocean:   { accent:'#38bdf8', bg:'#090a0f', surface:'#12141c', subtle:'#171a24', console:'#0c0e14', border:'#1e2230', cborder:'#222634' },
  emerald: { accent:'#34d399', bg:'#08100d', surface:'#101a16', subtle:'#15211c', console:'#0a120f', border:'#1b2b24', cborder:'#1f3029' },
  violet:  { accent:'#a78bfa', bg:'#0b0912', surface:'#14111f', subtle:'#1a1628', console:'#0e0b16', border:'#241f36', cborder:'#2a2440' },
  rose:    { accent:'#fb7185', bg:'#110a0d', surface:'#1b1216', subtle:'#22171c', console:'#140c10', border:'#33202a', cborder:'#3a2530' },
  amber:   { accent:'#fbbf24', bg:'#100d07', surface:'#1a160e', subtle:'#211c12', console:'#130f08', border:'#31281a', cborder:'#3a301e' },
  orange:  { accent:'#fb923c', bg:'#110b07', surface:'#1b130d', subtle:'#221911', console:'#140d08', border:'#33241a', cborder:'#3d2b1e' },
  indigo:  { accent:'#818cf8', bg:'#090a14', surface:'#121528', subtle:'#181b33', console:'#0c0e1d', border:'#212545', cborder:'#282d52' },
  teal:    { accent:'#2dd4bf', bg:'#07100f', surface:'#0f1a19', subtle:'#142120', console:'#091211', border:'#1a2c2a', cborder:'#1f3634' }
};
function applyTheme(name) {
  const t = THEMES[name] || THEMES.ocean;
  const r = document.documentElement.style;
  const rgb = t.accent.match(/\w\w/g).map(h => parseInt(h, 16)).join(',');
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-soft', 'rgba(' + rgb + ',.1)');
  r.setProperty('--accent-border', 'rgba(' + rgb + ',.28)');
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--surface-subtle', t.subtle);
  r.setProperty('--console-bg', t.console);
  r.setProperty('--border', t.border);
  r.setProperty('--console-border', t.cborder);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('on', d.dataset.t === name));
}

/* ===================== INIT ===================== */
const urlTheme = new URLSearchParams(location.search).get('theme');
if (COURSE.showThemePicker) {
  $('themeDots').innerHTML = Object.keys(THEMES).map(k =>
    '<button class="theme-dot" data-t="' + k + '" title="' + k + '" style="background:' + THEMES[k].accent + '" onclick="applyTheme(\'' + k + '\')"></button>').join('');
}
applyTheme(urlTheme && THEMES[urlTheme] ? urlTheme : COURSE.theme);
$('brandTitle').textContent = COURSE.brand;
$('brandSub').textContent = COURSE.subtitle;
document.title = COURSE.brand;
$('modalTitle').textContent = COURSE.modalTitle;
$('refHead').innerHTML = COURSE.refColumns.map(c => '<th>' + esc(c) + '</th>').join('');
$('refBody').innerHTML = COURSE.reference.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') stepLesson(1);
  if (e.key === 'ArrowLeft') stepLesson(-1);
  if (e.key === 'Escape') toggleModal(false);
});
window.addEventListener('DOMContentLoaded', () => loadLesson(0));

/* =====================================================================
   PROTECTION + WATERMARK (deterrents; they raise effort, not guarantee)
   ===================================================================== */
(function () {
  const WM = COURSE.watermark;
  const isField = t => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');

  // Block context menu, copy, cut, drag, select, and text-selection start
  ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(ev =>
    document.addEventListener(ev, e => { if (!isField(e.target)) e.preventDefault(); }));

  // Block common shortcuts: save, view-source, print, select-all, copy, devtools
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    const block =
      e.key === 'F12' ||
      (ctrl && ['s', 'u', 'p', 'a', 'c', 'x'].includes(k) && !isField(e.target)) ||
      (ctrl && e.shiftKey && ['i', 'j', 'c', 'k'].includes(k)) ||
      (e.metaKey && e.altKey && ['i', 'j', 'c', 'u'].includes(k));
    if (block) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  // Premium bottom watermark: glass pill, built with inline styles so it survives stylesheet edits
  function buildBar() {
    const bar = document.createElement('div');
    bar.id = 'wm-bar';
    bar.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483647;pointer-events:none;display:flex;align-items:center;gap:9px;padding:7px 16px 7px 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--accent-border);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);font:500 11.5px Inter,sans-serif;color:var(--text-secondary);letter-spacing:.2px;white-space:nowrap';
    bar.innerHTML = '<i style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);display:block"></i>' +
      '<span>Crafted by</span><b style="font:600 12px \'JetBrains Mono\',monospace;color:var(--accent)">' + WM + '</b>';
    return bar;
  }
  function ensureBar() {
    let bar = document.getElementById('wm-bar');
    if (bar) {
      const cs = getComputedStyle(bar), r = bar.getBoundingClientRect();
      const hidden = cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.5 || r.width < 40 || r.height < 10 || bar.textContent.indexOf(WM) === -1;
      if (!hidden) return;
      bar.remove();
    }
    document.body.appendChild(buildBar());
  }
  ensureBar();
  new MutationObserver(ensureBar).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
  setInterval(ensureBar, 2000);
})();
</script>
